<div>
    <img id="counter-img" alt="Website Views" />

<script>
    async function loadCounter() {
        const url = 'https://count.getloli.com/@:xliam1?scale=1.3&theme=3d-num';
        const res = await fetch(url);
        const svgText = await res.text();

        const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
        const digits = Array.from(doc.querySelectorAll('use'))
            .sort((a, b) => parseFloat(a.getAttribute('x')) - parseFloat(b.getAttribute('x')))
            .map(u => u.getAttribute('xlink:href').replace('#', ''))
            .join('');
        const count = parseInt(digits, 10);

        const blob = new Blob([svgText], { type: 'image/svg+xml' });
        const img = document.getElementById('counter-img');
        img.src = URL.createObjectURL(blob);
        img.alt = `${count} views`;
        img.title = img.alt;
    }

    loadCounter();
</script>
